name: Bug report
description: Report a problem with gow3_android
title: "[Bug]: "
labels: ["bug"]

body:
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: For example, Redmi K70 Pro

  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: For example, Android 16

  - type: input
    id: app_version
    attributes:
      label: App version or commit hash

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe how to reproduce the issue, if you know.
      placeholder: |
        1. Open the app.
        2. ...
        3. ...

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any relevant error messages here, or attach a log file below.

  - type: upload
    id: attachments
    attributes:
      label: Attach screenshots, logs, or videos
      description: Optional. Upload files that may help reproduce or diagnose the issue.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip,.mp4,.mov,.webm"