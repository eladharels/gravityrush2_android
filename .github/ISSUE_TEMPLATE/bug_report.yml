name: Bug report
description: Report a problem with gow3_android
title: "[Bug]: "
labels: ["bug"]

body:
  - type: input
    id: device
    attributes:
      label: Device model / 设备型号
      placeholder: For example, Redmi K70 Pro

  - type: input
    id: android_version
    attributes:
      label: Android version / Android 版本
      placeholder: For example, Android 16

  - type: input
    id: app_version
    attributes:
      label: App version or commit hash / 应用版本或提交哈希

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Describe how to reproduce the issue, if you know. / 描述如何复现问题（如果知道的话）。
      placeholder: |
        1. Open the app.
        2. ...

  - type: textarea
    id: actual
    attributes:
      label: What happened? / 实际发生了什么？
      description: Briefly describe the problem. / 简要描述问题现象。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen? / 期望的行为是什么？

  - type: textarea
    id: log_zip
    attributes:
      label: Log zip (required) / 日志 zip（必填）
      description: |
        **Required.** Issues without the exported log zip may be closed without investigation.
        
        1. In the launcher, open **About → 导出日志 / Export logs** to generate the log `.zip` (it contains `android-game.log` and more).
        2. **Drag and drop the .zip file directly into this text box** — GitHub uploads it and inserts a link like `[God.of.War.III-….zip](https://github.com/user-attachments/…)`.
        3. If the export failed, paste the log text (`android-game.log`) here instead.
        
        **必填。** 没有日志 zip 的问题可能被直接关闭、不予排查。
        在启动器「关于 → 导出日志」生成日志 .zip（内含 android-game.log 等文件），
        把 zip 文件直接拖拽进本输入框（GitHub 会自动上传并插入链接）；
        若导出失败，可改为把 android-game.log 的文本内容粘贴到这里。
      placeholder: |
        Drag the exported log .zip here, e.g. [gow3-logs-2026-10-17.zip](https://github.com/user-attachments/…)
        把导出的日志 .zip 拖拽到这里
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Other error messages / 其他错误信息
      description: Paste any relevant error messages here (crash dialogs, Vulkan errors, …). / 粘贴其他相关的错误信息（崩溃弹窗、Vulkan 报错等）。

  - type: dropdown
    id: log_zip_confirmed
    attributes:
      label: Did you attach the exported log zip? / 是否已附上导出的日志 zip？
      options:
        - "Yes / 是"
        - "No, the export failed (pasted log text instead) / 否，导出失败，已粘贴日志文本"
    validations:
      required: true

  - type: upload
    id: attachments
    attributes:
      label: Attach screenshots or videos / 附上截图或视频
      description: Optional. Screenshots or a screen recording help a lot. / 可选。截图或录屏对排查很有帮助。
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip,.mp4,.mov,.webm"
